<style>
    /* Hide error UI by default - Blazor will show it only on actual errors */
    #blazor-error-ui {
        display: none;
    }
</style>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    
    <!-- Formspree integration script -->
    <script>
        window.sendFormspree = async function(formId, data) {
            try {
                const response = await fetch(`https://formspree.io/f/${formId}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify(data)
                });
                
                if (response.ok) {
                    return true;
                } else {
                    console.error('Formspree error:', response.status, response.statusText);
                    return false;
                }
            } catch (error) {
                console.error('Formspree fetch error:', error);
                return false;
            }
        };
    </script>
    
    <script src="_framework/blazor.webassembly.js"></script>
</body>
